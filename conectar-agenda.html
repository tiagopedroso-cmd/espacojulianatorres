<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectar agenda — Espaço Juliana Torres</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8ece7;color:#402b2c;font-family:system-ui}.card{width:min(100%,480px);padding:36px;border-radius:20px;background:#fff9f6;box-shadow:0 18px 50px #402b2c22}h1{font-family:Georgia,serif;margin:0 0 12px}p{line-height:1.6}label{display:grid;gap:8px;font-weight:700;margin-top:24px}input,button{min-height:48px;border-radius:9px;font:inherit}input{border:1px solid #d89a8e;padding:0 12px}button{margin-top:18px;border:0;background:#773b3f;color:white;font-weight:800;cursor:pointer;width:100%}.message{min-height:24px}.ok{color:#2d6b43}.error{color:#9b2e23}</style><main class="card"><h1>Conectar agenda da Juliana</h1><p>Área administrativa. Entre somente com <strong>julianagodinho.life@gmail.com</strong>.</p><form id="form"><label>Código administrativo<input name="secret" type="password" required autocomplete="off"></label><button>Continuar com Google</button></form><p id="message" class="message" role="alert"></p></main><script>const message=document.querySelector('#message'),status=new URLSearchParams(location.search).get('status');if(status==='conectado'){message.textContent='Agenda conectada com sucesso.';message.className='message ok'}if(status==='cancelado'){message.textContent='Autorização cancelada.';message.className='message error'}document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;message.textContent='Abrindo autorização…';try{const response=await fetch('/api/oauth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:new FormData(e.currentTarget).get('secret')})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Não foi possível iniciar a conexão.');location.assign(data.url)}catch(error){message.textContent=error.message;message.className='message error';button.disabled=false}})</script></html>
