<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galeria — Espaço Juliana Torres</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8ece7;color:#402b2c;font:16px/1.5 system-ui,sans-serif}.card{width:min(460px,calc(100% - 40px));padding:30px;background:#fff;border:1px solid #eadad5;border-radius:18px;box-shadow:0 15px 40px #402b2c18}h1{font:500 38px Georgia,serif;margin:0 0 8px;color:#773b3f}label{display:grid;gap:6px;margin:18px 0;font-weight:700}input{min-height:44px;border:1px solid #e5d4cf;border-radius:9px;padding:0 12px}button{min-height:48px;border:0;border-radius:9px;background:#773b3f;color:#fff;padding:0 18px;font-weight:800;cursor:pointer}#status{margin-top:14px;color:#806a68}</style>
<main class="card"><h1>Atualizar galeria</h1><p>Envie fotos para a galeria do Espaço Juliana Torres.</p><form id="upload"><label>Chave administrativa<input id="key" type="password" required></label><label>Fotos<input id="files" type="file" accept="image/*" multiple required></label><button>Enviar fotos</button></form><p id="status" role="status"></p></main>
<script>const form=document.querySelector('#upload'),status=document.querySelector('#status');form.addEventListener('submit',async event=>{event.preventDefault();const files=[...document.querySelector('#files').files],key=document.querySelector('#key').value;status.textContent='Enviando…';try{for(const file of files){const res=await fetch('/api/gallery/upload?filename='+encodeURIComponent(file.name),{method:'PUT',headers:{'x-gallery-key':key,'content-type':file.type,'content-length':file.size},body:file});if(!res.ok)throw new Error('Não foi possível enviar '+file.name)}status.textContent='Fotos enviadas com sucesso.';form.reset()}catch(error){status.textContent=error.message}})</script>
